services:

  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: artemis-fleet

    environment:
      - ANONYMOUS_LOGIN=true
      - ARTEMIS_USER
      - ARTEMIS_PASSWORD

    ports:
      - "5672:5672"
      - "61616:61616"
      - "1883:1883"
      - "8161:8161"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/var/lib/artemis-instance/bin/artemis check node --url tcp://localhost:61616 --user $${ARTEMIS_USER} --password $${ARTEMIS_PASSWORD} >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - fleet-net

    restart: unless-stopped


  traccar:
    image: traccar/traccar:latest
    container_name: traccar-fleet

    ports:
      - "8082:8082"
      - "5001:5001"
      - "5002:5002"
      - "5055:5055"

    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro

    environment:
      - CONFIG_USE_ENVIRONMENT_VARIABLES=true

    networks:
      - fleet-net

    restart: unless-stopped


  postgres:
    image: postgres:16
    container_name: postgres-delivery

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery}

    ports:
      - "55432:5432"

    volumes:
      - delivery_postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - fleet-net

    restart: unless-stopped

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock-push

    ports:
      - "8089:8080"

    volumes:
      - ./wiremock:/home/wiremock

    networks:
      - fleet-net

    restart: unless-stopped

  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile

    container_name: broker-fleet

    environment:
      - ARTEMIS_AMQP_URL=${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      - ARTEMIS_USER
      - ARTEMIS_PASSWORD

    ports:
      - "8080:8080"

    depends_on:
      artemis:
        condition: service_healthy

    networks:
      - fleet-net

    restart: unless-stopped


  positions-consumer:
    build:
      context: .
      dockerfile: positions-consumer/Dockerfile

    container_name: positions-consumer-fleet

    environment:
      - ARTEMIS_AMQP_URL=${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      - ARTEMIS_USER
      - ARTEMIS_PASSWORD

    depends_on:
      artemis:
        condition: service_healthy

    networks:
      - fleet-net

    restart: unless-stopped


  events-consumer:
    build:
      context: .
      dockerfile: events-consumer/Dockerfile

    container_name: events-consumer-fleet

    environment:
      - ARTEMIS_AMQP_URL=${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      - ARTEMIS_USER
      - ARTEMIS_PASSWORD

    depends_on:
      artemis:
        condition: service_healthy

    networks:
      - fleet-net

    restart: unless-stopped


  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    container_name: delivery-service
    environment:
      - ARTEMIS_AMQP_URL=${ARTEMIS_AMQP_URL:-tcp://artemis:61616}
      - ARTEMIS_USER
      - ARTEMIS_PASSWORD
      - JDBC_URL=jdbc:postgresql://postgres:5432/delivery
      - POSTGRES_USER=${POSTGRES_USER:-delivery}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-delivery}
      - PUSH_URL=http://wiremock:8080/push
    ports:
      - "8081:8080"
    depends_on:
      artemis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
    networks:
      - fleet-net
    restart: unless-stopped


networks:
  fleet-net:
    driver: bridge


volumes:
  delivery_postgres_data: